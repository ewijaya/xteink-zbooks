name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Lua 5.5 static lint & API 2.18 checks
        run: python3 tools/lint.py

      - name: Run bridge & EPUB TOC cleaner tests
        run: python3 -m unittest discover -s server/tests -v
